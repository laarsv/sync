server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle nicht-existierenden Pfade auf index.html.
    # /api/* wird hier NICHT bedient - das routet Caddy direkt zum Backend.
    location / {
        try_files $uri /index.html;
    }

    # Gehashte Assets: lange cachen.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
