# Self-contained stack: backend + frontend + Caddy (automatic HTTPS).
# The easiest way to self-host. Set DOMAIN and the secrets in .env, then:
#   docker compose up -d --build
#
# Caddy obtains a Let's Encrypt certificate for $DOMAIN automatically, so the
# server must be reachable on ports 80/443 and DNS must point $DOMAIN here.
#
# Already running a central reverse proxy? Use docker-compose.prod.yml
# instead (see README, "Behind an existing reverse proxy").

name: sync

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Derived from DOMAIN so you only configure it once.
      APP_BASE_URL: "https://${DOMAIN:?set DOMAIN in .env}"
      DATABASE_URL: "sqlite:////app/data/sync.db"
      COOKIE_SECURE: "true"
    volumes:
      - sync_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  sync_data:
  caddy_data:
  caddy_config:
